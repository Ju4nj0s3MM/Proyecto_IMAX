<!doctype html><html lang="es"><head><meta charset="utf-8"><title>IMAX · Reportes de venta</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/css/styles.css"></head>
<body>
<main>
  <h1>Reportes de venta</h1>
  <div class="card">
    <h2>Ocupación y recaudación de una función</h2>
    <div class="row">
      <label>Función (id) <input id="funcion" type="number" min="1" value="1"></label>
      <button id="ver">Consultar</button>
    </div>
    <div id="ocupacion"></div>
  </div>
  <div class="card">
    <h2>Métodos de pago más usados</h2>
    <table id="metodos"></table>
  </div>
  <div id="msg" class="msg" hidden></div>
</main>
<script src="/js/api.js"></script><script src="/js/nav.js" data-auth="required"></script>
<script>
  const msg = document.getElementById('msg');
  document.getElementById('ver').onclick = async () => {
    try {
      const r = await api('/venta/reportes/ocupacion?funcion_id=' + document.getElementById('funcion').value);
      document.getElementById('ocupacion').innerHTML = `
        <p><strong>${r.titulo}</strong> · ${r.sala || ''} ${r.inicio ? '· ' + fmtFecha(r.inicio) : ''}</p>
        <p>Asientos vendidos: <strong>${r.asientos_vendidos}</strong> de ${r.capacidad} (${r.porcentaje_ocupacion} %)</p>
        <p>Recaudado: <strong>${r.recaudado}</strong></p>`;
      msg.hidden = true;
    } catch (e) { mostrarMensaje(msg, e.message, 'err'); }
  };
  api('/venta/reportes/metodos-pago').then(filas => {
    document.getElementById('metodos').innerHTML =
      '<tr><th>Método</th><th>Pagos</th><th>% de uso</th><th>Monto</th></tr>' +
      filas.map(f => `<tr><td>${f.metodo_pago}</td><td>${f.pagos}</td><td>${f.porcentaje_uso ?? 0} %</td><td>${f.monto_total}</td></tr>`).join('');
  }).catch(e => mostrarMensaje(msg, e.message, 'err'));
</script>
</body></html>
